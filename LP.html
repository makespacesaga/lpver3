  <!-- tweaks-panel -->
  <script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;

    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);

  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);transition:transform .12s}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <button
        onClick={() => setOpen(o => !o)}
        style={{
          position: 'fixed', right: 16, bottom: open ? 'auto' : 16,
          top: open ? 'auto' : 'auto',
          zIndex: 2147483645, background: 'var(--fg)', color: 'var(--bg)',
          border: 'none', padding: '10px 16px', fontSize: 11, letterSpacing: '0.1em',
          cursor: 'pointer', display: open ? 'none' : 'block',
          boxShadow: '0 4px 16px rgba(0,0,0,0.2)',
        }}
      >TWEAKS</button>
      {open && (
        <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      )}
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakRow({ label, children }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      {children}
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  return (
    <TweakRow label={label}>
      <div role="radiogroup" className="twk-seg">
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}
                  onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

const TweakRadioCustom = ({ value, onChange, options }) => (
  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8 }}>
    {options.map((opt) => {
      const active = value === opt.value;
      return (
        <button key={opt.value} type="button" onClick={() => onChange(opt.value)}
          style={{
            background: active ? 'var(--fg)' : 'transparent',
            color: active ? 'var(--bg)' : 'var(--fg)',
            border: '1px solid ' + (active ? 'var(--fg)' : 'var(--line)'),
            padding: '10px 12px', fontSize: 11, cursor: 'pointer',
            display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start',
            transition: 'all .25s ease', fontFamily: 'inherit', letterSpacing: '0.04em'
          }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {opt.sw.map((c, ci) => (
              <span key={ci} style={{ width: 16, height: 16, borderRadius: 2, background: c, border: '1px solid rgba(0,0,0,0.06)' }}/>
            ))}
          </div>
          <span>{opt.label}</span>
        </button>
      );
    })}
  </div>
);

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakRow, TweakRadio, TweakSelect, TweakRadioCustom });
  </script>

function useCountUp(target, duration = 1600) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef(null);
  const started = React.useRef(false);
  React.useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting && !started.current) {
          started.current = true;
          const startT = performance.now();
          const tick = (now) => {
            const p = Math.min(1, (now - startT) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            setVal(target * eased);
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.5 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, [target, duration]);
  return [val, ref];
}

const ResultStat = ({ value, suffix, label, decimals = 0 }) => {
  const [v, ref] = useCountUp(value, 1600);
  const display = decimals > 0 ? v.toFixed(decimals) : Math.round(v);

    <div ref={ref} style={{ textAlign: 'center' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 4 }}>
        <span className="serif" style={{ fontSize: 'clamp(40px, 6vw, 64px)', fontWeight: 500, color: 'var(--fg)', lineHeight: 1 }}>{display}</span>

  <script type="text/babel">
const TWEAK_DEFAULTS = { theme: 'beige', fontHeading: 'serif', mainCopy: 'default' };

const CopyApplier = ({ copy }) => {
  React.useEffect(() => {
    const h1 = document.querySelector('section#top h1');

      h1.innerHTML = '一生ものの<br/>カラダと習慣を、<br/>佐賀で<span style="background: linear-gradient(transparent 70%, var(--accent-2) 70%); padding-inline: 2px;">育てる</span>。';

      h1.innerHTML = '痩せたい。<br/>でも、もう<wbr/><span style="background: linear-gradient(transparent 70%, var(--accent-2) 70%); padding-inline: 2px;">無理はしたくない</span>あなたへ。';
    }
  }, [copy]);
  return null;
};

  <div className="mobile-cta">
    <div className="mobile-cta-info">
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#22c55e', flexShrink: 0 }}></span>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 5.582 2 10c0 2.554 1.508 4.83 3.872 6.342L5 21l4.293-2.347c.864.155 1.77.238 2.707.238 5.523 0 10-3.582 10-8s-4.477-9-10-9z"/></svg>
        LINE体験予約（¥3,300）
      </a>
      <a href="tel:0952322135" className="m-trial">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3-8.59A2 2 0 0 1 3.59 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        電話する
      </a>

  </div>
);

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [menuOpen, setMenuOpen] = React.useState(false);

  React.useEffect(() => {
    const theme = t.theme === 'beige' ? '' : t.theme;
    if (theme) document.documentElement.setAttribute('data-theme', theme);
    else document.documentElement.removeAttribute('data-theme');
  }, [t.theme]);

  React.useEffect(() => {
    if (t.fontHeading === 'sans') {
      document.querySelectorAll('.serif').forEach(el => { el.style.fontFamily = "'Noto Sans JP', sans-serif"; });
    } else {
      document.querySelectorAll('.serif').forEach(el => { el.style.fontFamily = ''; });
    }
  }, [t.fontHeading]);

  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  React.useEffect(() => {
    const id = setTimeout(() => {
      const el = document.getElementById('loading');
      if (el) { el.classList.add('gone'); setTimeout(() => { el.style.display = 'none'; }, 700); }
    }, 500);
    return () => clearTimeout(id);
  }, []);

  React.useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (href.length <= 1) return;
      const target = document.querySelector(href);
      if (!target) return;
      e.preventDefault();
      const y = target.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: y, behavior: 'smooth' });
    };
    document.addEventListener('click', onClick);
    return () => document.removeEventListener('click', onClick);
  }, []);

  return (
    <React.Fragment>
      <SummerBanner />
      <Nav onMenuToggle={() => setMenuOpen(!menuOpen)} isOpen={menuOpen} />
      <Hero />
      <Pain />
      <MobileCTAStrip />
      <Why />
      <Service />
      <Gallery />
      <Results />
      <Flow />
      <Campaign />
      <FAQ />
      <Access />
      <SafetyGuarantee />
      <FinalCTA />
      <Footer />
      <MobileCTA />
      <TweaksPanel title="Tweaks">
        <TweakSection label="カラーテーマ">
          <TweakRadioCustom
            value={t.theme}
            onChange={(v) => setTweak('theme', v)}
            options={[
              { value: 'beige', label: 'Beige × Gold', sw: ['#FAF7F1', '#C49A6C', '#2B2620'] },
              { value: 'rose', label: 'Dusty Rose', sw: ['#FBF4F1', '#C88579', '#3A2A26'] },
              { value: 'green', label: 'Sage Green', sw: ['#F6F4EC', '#859469', '#25302A'] },
              { value: 'clean', label: 'Clean Brown', sw: ['#FCFBF8', '#806A4E', '#1F1B17'] },
            ]}
          />
        </TweakSection>
        <TweakSection label="見出しフォント">
          <TweakRadio label="書体" value={t.fontHeading} onChange={(v) => setTweak('fontHeading', v)}
            options={[{ value: 'serif', label: '明朝' }, { value: 'sans', label: 'ゴシック' }]} />
        </TweakSection>
        <TweakSection label="メインコピー">
          <TweakSelect label="ヘッドライン" value={t.mainCopy} onChange={(v) => setTweak('mainCopy', v)}
            options={[
              { value: 'default', label: '無理はしたくないあなたへ' },
              { value: 'gentle', label: '一生もののカラダへ' },
              { value: 'direct', label: '健康的に、美しく' },
            ]} />
        </TweakSection>
      </TweaksPanel>
      <CopyApplier copy={t.mainCopy} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
